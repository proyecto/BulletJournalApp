name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for release (e.g. v2.0.1)'
        required: false
        default: 'v2.0.1'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📁 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: 🏗️ Expo Prebuild (Generate Android Project)
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Android Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Determine Tag Name
        id: tag_name
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            echo "TAG=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: 🚀 Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Punteo ${{ env.TAG }}
          body: |
            ## 📓 Punteo Release ${{ env.TAG }}
            
            Standalone Android APK compiled via GitHub Actions & Gradle.
            
            ### 📱 Installation:
            Download `app-release.apk` below and install it directly on your Android device.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
