name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for release (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📁 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 17 (Required for Gradle/EAS)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: 🛠️ Build APK Locally via EAS
        run: eas build --platform android --profile preview --local --output=punteoapp.apk

      - name: 🏷️ Determine Tag Name
        id: tag_name
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.version_tag }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: 🚀 Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Punteo ${{ env.TAG }}
          body: |
            ## 📓 Punteo Release ${{ env.TAG }}
            
            Automatic build artifact generated via EAS & GitHub Actions.
            
            ### 📱 Download & Install:
            - Download `punteoapp.apk` below and install it directly on your Android device.
          files: punteoapp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
